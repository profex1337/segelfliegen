<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Cloud Function E-Mail Test</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; }
        h2 { margin-top: 30px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        button { padding: 12px 24px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; color: #fff; margin: 6px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-kontakt { background: #0f3460; }
        .btn-gutschein { background: #e94560; }
        .btn-abhol { background: #6a1b9a; }
        .btn-gastflug { background: #2e7d32; }
        .btn-reminder { background: #e65100; }
        .result { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; }
        .success { background: #e8f5e9; color: #2e7d32; }
        .error { background: #fce4ec; color: #c62828; }
        .section { background: #f9f9f9; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        input[type="email"] { display:block; width:100%; padding:10px; margin-top:4px; border:2px solid #ddd; border-radius:8px; font-size:15px; box-sizing:border-box; }
    </style>
</head>
<body>
    <h1>Cloud Function E-Mail Test</h1>

    <h2>sendPublicEmail — Benachrichtigung an Verein (+ Auto-Reply)</h2>
    <div class="section">
        <button class="btn-kontakt" onclick="sendPublic('kontakt')">Kontakt</button>
        <button class="btn-gutschein" onclick="sendPublic('gutschein-ueberw')">Gutschein (Überw.)</button>
        <button class="btn-abhol" onclick="sendPublic('gutschein-abhol')">Gutschein (Abhol.)</button>
        <button class="btn-gastflug" onclick="sendPublic('gastflug')">Gastflug</button>
    </div>

    <h2>sendAdminEmail — Reminder / Bezahlt-Benachrichtigung</h2>
    <div class="section">
        <p style="font-size:0.85rem; color:#666; margin:0 0 12px;">Erfordert Firebase-Login (Admin oder bestellung@)</p>
        <label style="display:block; margin-bottom:12px; font-weight:600;">Empfänger-E-Mail (Reminder):
            <input type="email" id="test-email" placeholder="deine@email.de" />
        </label>
        <button class="btn-reminder" onclick="sendAdmin('paymentReminder')">Reminder (Überw.)</button>
        <button class="btn-reminder" onclick="sendAdmin('paymentReminderAbhol')" style="background:#6a1b9a;">Reminder (Abhol.)</button>
        <button class="btn-gutschein" onclick="sendAdmin('paidNotification')">Bezahlt-Benachrichtigung</button>
    </div>

    <div id="result" class="result"></div>

    <script>
        var CF_URL = 'https://europe-west1-segelfliegen.cloudfunctions.net/sendPublicEmail';

        function show(text, err) {
            var r = document.getElementById('result');
            r.className = 'result ' + (err ? 'error' : 'success');
            r.style.display = 'block';
            r.textContent = text;
        }
        function lock(d) { document.querySelectorAll('button').forEach(function(b){b.disabled=d;}); }

        function sendPublic(type) {
            lock(true);
            var data = {
                name: 'Max Mustermann (TEST)',
                email: 'test@example.com',
                telefon: '0123 456789'
            };

            if (type === 'kontakt') {
                data.formType = 'kontakt';
                data.betreff = 'Allgemein';
                data.message = 'Testnachricht Kontaktformular. Bitte ignorieren!';
            } else if (type.indexOf('gutschein') === 0) {
                var isAbhol = type.indexOf('abhol') !== -1;
                data.formType = 'gutschein';
                data.flugart = isAbhol ? 'Motorsegler' : 'Segelflug (Windenstart)';
                data.zusatzzeit = '10';
                data.wert = '55,50';
                data.wertAnzeigen = true;
                data.empfaenger = 'Erika Musterfrau';
                data.anlass = 'Geburtstag';
                data.zustellung = isAbhol ? 'Abholung in 90518 Altdorf (Barzahlung vor Ort)' : 'E-Mail (Zahlung per \u00DCberweisung)';
                data.grusstext = 'Alles Gute zum Geburtstag! (TEST)';
            } else {
                data.formType = 'gastflug';
                data.interest = 'Segelflug';
                data.message = 'Ich w\u00FCrde gerne mal mitfliegen! (TEST)';
            }

            fetch(CF_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
            .then(function(r) {
                if (r.ok) show('sendPublicEmail (' + type + ') erfolgreich!');
                else show('Fehler: ' + (r.data.error || JSON.stringify(r.data)), true);
                lock(false);
            })
            .catch(function(e) { show('Fehler: ' + e.message, true); lock(false); });
        }

        function sendAdmin(action) {
            show('sendAdminEmail erfordert Firebase Auth. Bitte in intern.html oder bestellungen/ testen.', true);
        }
    </script>
</body>
</html>
