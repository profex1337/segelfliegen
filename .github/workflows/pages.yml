name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Automatisch hochgeladene News-/Flugzeugpark-Bilder (von der uploadImage/deleteImage
    # Cloud Function ins Repo committet) brauchen KEINEN Pages-Deploy — sie werden direkt
    # über raw.githubusercontent.com ausgeliefert. Sonst löst jeder Bild-Upload einen
    # (heute oft fehlschlagenden) Deploy aus.
    paths-ignore:
      - 'images/news_*'
      - 'images/aircraft_*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
